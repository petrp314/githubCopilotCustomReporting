name: Synthetic validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify preinstalled runtimes
        run: |
          python -c 'import sys; assert sys.version_info >= (3, 12)'
          node --version
      - name: Test synthetic fixtures
        run: npm test
      - name: Build synthetic dashboard (never uploaded)
        run: npm run build
