name: Publish synthetic dashboard

on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'petrp314/githubCopilotCustomReporting' &&
      github.event.repository.owner.type == 'User' &&
      vars.REPORTING_ENABLED != 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify preinstalled runtimes
        run: |
          python -c 'import sys; assert sys.version_info >= (3, 12)'
          node --version
      - name: Test synthetic fixtures
        run: npm test
      - name: Build only synthetic data (no credentials or collection)
        run: npm run build
      - name: Verify synthetic-only static artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from copilot_reporting.deployment import validate_site

          validate_site("dist")
          report = json.loads(Path("dist/data/report.json").read_text(encoding="utf-8"))
          if report.get("demo") is not True:
              raise SystemExit("Refusing to publish a non-synthetic report.")
          PY
      - name: Upload synthetic dashboard only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: >-
      github.repository == 'petrp314/githubCopilotCustomReporting' &&
      github.event.repository.owner.type == 'User' &&
      vars.REPORTING_ENABLED != 'true' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy synthetic dashboard
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
